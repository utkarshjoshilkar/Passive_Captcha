version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: passivecaptcha-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: passive_captcha_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./server/server
      dockerfile: Dockerfile
    container_name: passivecaptcha-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/passive_captcha_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      - mysql
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: passivecaptcha-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
